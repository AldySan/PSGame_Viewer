name: Windows build

# Builds the Windows portable archive and attaches it to a release.
#
# - push of a v* tag: builds exactly the pushed tag and attaches the
#   archive to that tag's release
# - manual run (workflow_dispatch): builds the branch it was dispatched
#   on; the "release_tag" input says which release the archive goes to.
#   The upload step only runs on the dev branch, so trial runs from
#   feature branches leave the release untouched (the artifact is still
#   kept on the run page for inspection).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the archive to'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build zlib (static, from source)
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git $env:RUNNER_TEMP/zlib-src
          cmake -S $env:RUNNER_TEMP/zlib-src -B $env:RUNNER_TEMP/zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/zlib-install
          cmake --build $env:RUNNER_TEMP/zlib-build
          cmake --install $env:RUNNER_TEMP/zlib-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/zlib-install"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package the portable archive
        run: pwsh packaging/make-portable.ps1 -BuildDir build

      - name: Keep the archive as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: PSGame-Viewer-*-win64-portable.zip

      - name: Attach the archive to the release
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$env:TAG" PSGame-Viewer-*-win64-portable.zip --clobber
