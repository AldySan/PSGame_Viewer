name: Windows build

# Builds the Windows portable archive and attaches it to a release.
#
# - push of a v* tag: builds exactly the pushed tag and attaches the
#   archive to that tag's release
# - manual run (workflow_dispatch): builds the branch it was dispatched
#   on; the "release_tag" input says which release the archive goes to.
#   The upload step only runs on the dev branch, so trial runs from
#   feature branches leave the release untouched (the artifact is still
#   kept on the run page for inspection).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the archive to'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build zlib (static, from source)
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git "$env:RUNNER_TEMP/zlib-src"
          cmake -S "$env:RUNNER_TEMP/zlib-src" -B "$env:RUNNER_TEMP/zlib-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/zlib-install"
          cmake --build "$env:RUNNER_TEMP/zlib-build"
          cmake --install "$env:RUNNER_TEMP/zlib-build"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/zlib-install"

      - name: Build
        # -k 100 keeps going past compile errors, so one run surfaces
        # every platform-specific problem instead of only the first
        run: cmake --build build -- -k 100

      - name: Test
        run: |
          # a crashing process must terminate the step instead of waiting
          # forever on the Windows Error Reporting dialog
          reg add "HKLM\Software\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f | Out-Null
          ctest --test-dir build --output-on-failure --verbose --timeout 120

      # TEMPORARY diagnosis: every test function exits with 0xC0000135
      # (STATUS_DLL_NOT_FOUND) — something the test executable imports is
      # not on the runner. List the imports and capture the loader error,
      # which names the missing DLL. Remove once the Windows run is green.
      - name: Diagnose the missing DLL
        if: always()
        run: |
          dumpbin /dependents build\tst_psgcore.exe
          $p = Start-Process -FilePath "build\tst_psgcore.exe" -ArgumentList "aesNistVectors" -NoNewWindow -PassThru -RedirectStandardError diag_err.txt -RedirectStandardOutput diag_out.txt
          $null = $p.WaitForExit(15000)
          Write-Host "--- exit code: $($p.ExitCode)"
          Write-Host "--- stderr:"
          Get-Content diag_err.txt -ErrorAction SilentlyContinue
          Write-Host "--- stdout:"
          Get-Content diag_out.txt -ErrorAction SilentlyContinue

      - name: Package the portable archive
        run: pwsh packaging/make-portable.ps1 -BuildDir build

      - name: Keep the archive as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: PSGame-Viewer-*-win64-portable.zip

      - name: Attach the archive to the release
        if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$env:TAG" PSGame-Viewer-*-win64-portable.zip --clobber
